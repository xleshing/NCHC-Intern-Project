- name: Fetch all vol for project
  uri:
    url: "https://apigateway.twcc.ai/api/v3/{{ twcc_api_host }}/volumes/?project={{ twcc_project_id }}"
    method: GET
    headers:
      Accept: application/json
      x-api-host: "{{ twcc_api_host }}"
      x-api-key: "{{ twcc_api_key }}"
  register: vol_response

- name: Ensure delete_start/end are integers
  set_fact:
    delete_count: "{{ delete_count | int }}"

- name: Select vol IDs
  set_fact:
    vol_ids_to_delete: >-
      {{ (vol_response.json
        | selectattr('is_bootable', 'equalto', false)
        | selectattr('status', 'equalto', 'AVAILABLE')
        | sort(attribute='create_time')
        | reverse
        | map(attribute='id')
        | list)[:(delete_count | int)] }}

- name: Confirm deletion of vol_ids
  pause:
    prompt: "delete Vol IDs: {{ vol_ids_to_delete }}"

- name: Delete selected Vols
  uri:
    url: "https://apigateway.twcc.ai/api/v3/{{ twcc_api_host }}/volumes/{{ item }}/"
    method: DELETE
    headers:
      x-api-host: "{{ twcc_api_host }}"
      x-api-key: "{{ twcc_api_key }}"
    status_code: [200,204]
    timeout: 600
  loop: "{{ vol_ids_to_delete }}"
  loop_control:
    label: "{{ item }}"
  register: delete_results

- name: Show deletion results
  debug:
    msg: "Deleted Vol_ID {{ item.item }}: HTTP status {{ item.status }}"
  loop: "{{ delete_results.results }}"
