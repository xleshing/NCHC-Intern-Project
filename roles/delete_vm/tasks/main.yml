- name: Fetch all sites for project
  uri:
    url: "https://apigateway.twcc.ai/api/v3/{{ twcc_api_host }}/sites/?project={{ twcc_project_id }}"
    method: GET
    headers:
      Accept: application/json
      x-api-host: "{{ twcc_api_host }}"
      x-api-key: "{{ twcc_api_key }}"
  register: sites_response

- name: Ensure delete_start/end are integers
  set_fact:
    delete_start: "{{ delete_start | int }}"
    delete_end:   "{{ delete_end   | int }}"
  set_fact:
    delete_start: "{{ delete_start | int }}"
    delete_end:   "{{ delete_end   | int }}"

- name: Select site IDs
  set_fact:
    site_ids_to_delete: >-
      {{ (sites_response.json
        | sort(attribute='create_time')
        | reverse
        | map(attribute='id')
        | list)[(delete_start | int):(delete_end | int)] }}

- name: Confirm deletion of site_ids
  pause:
    prompt: "即將刪除以下 VM IDs: {{ site_ids_to_delete }}，按 Enter 繼續，Ctrl+C 取消"

- name: Delete selected VMs
  uri:
    url: "https://apigateway.twcc.ai/api/v3/{{ twcc_api_host }}/sites/{{ item }}/"
    method: DELETE
    headers:
      x-api-host: "{{ twcc_api_host }}"
      x-api-key: "{{ twcc_api_key }}"
    status_code: [200,204]
    timeout: 600
  loop: "{{ site_ids_to_delete }}"
  loop_control:
    label: "{{ item }}"
  register: delete_results

- name: Show deletion results
  debug:
    msg: "Deleted SITE_ID {{ item.item }}: HTTP status {{ item.status }}"
  loop: "{{ delete_results.results }}"
