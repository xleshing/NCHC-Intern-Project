  roles:
    - install-k8s-deps
# ── install_all_deps_complet ──────────────────────────────────────

# ── deploy_main_cluster_start ──────────────────────────────────────
- name: Deploy Kubernetes Master and generate tokens
  hosts: control_plan
  remote_user: "{{ ssh_user }}"
  become: true
#  vars:
#    ansible_become_pass: "{{ secret }}"
  tasks:     
    - name: Init Kubernetes Master
      master_init:
        cluster_cidr: "{{ cluster_cidr_args }}"
        cluster_endpoint: "{{ hostvars[ groups[endpoint_target_group_name][0] ].vars.ansible_host }}"
        kube_user: "{{ ansible_user }}"
      register: init_out
    - debug:
        msg:
          - "cluster_cidr: {{ cluster_cidr_args }}"
          - "join_endpoint: {{ init_out.join_endpoint }}"
          - "token: {{ init_out.token }}"
          - "discovery_token_hash: {{ init_out.discovery_token_hash }}"
          - "certificate_key: {{ init_out.certificate_key }}"

- name: Join Kubernetes Master
  hosts: masters
  become: true
  # If do not execute the steps in order, a check etcd health timeout err may occur.
  #serial: 1
  vars:
#    ansible_become_pass: "{{ secret }}"
    join_endpoint: "{{ hostvars[ groups[cp_target_group_name][0] ].init_out.join_endpoint }}"
    token: "{{ hostvars[ groups[cp_target_group_name][0] ].init_out.token }}"
    discovery_token_hash: "{{ hostvars[ groups[cp_target_group_name][0] ].init_out.discovery_token_hash }}"
    certificate_key: "{{ hostvars[ groups[cp_target_group_name][0] ].init_out.certificate_key }}"
  tasks:
    - name: Join Kubernetes Master
      master_join:
        join_endpoint: "{{ join_endpoint }}"
        token: "{{ token }}"
        discovery_token_hash: "{{ discovery_token_hash }}"
        certificate_key: "{{ certificate_key }}"
      register: master_join_out
    - debug:
        msg: "Join output: {{ master_join_out.stdout }}"
# If a “check etcd health timeout” err occurs, try waiting for a while—this may resolve the issue. 
#    - name: Wait "{{ wait_etcd_timeout }}" s for etcd to stabilise
#      pause:
#        seconds: "{{ wait_etcd_timeout }}"

- name: Deploy Kubernetes Worker and using tokens
  hosts: workers
  become: true
  # If not execute the steps in order, cilium pod Init:CrashLoopBackOff err may occur.
  #serial: 1
  vars:
#    ansible_become_pass: "{{ secret }}"
    join_endpoint: "{{ hostvars[ groups[cp_target_group_name][0] ].init_out.join_endpoint }}"
    token: "{{ hostvars[ groups[cp_target_group_name][0] ].init_out.token }}"
    discovery_token_hash: "{{ hostvars[ groups[cp_target_group_name][0] ].init_out.discovery_token_hash }}"
  tasks:                                                          
    - name: Init Kubernetes Worker
      worker_init:
        join_endpoint: "{{ join_endpoint }}"
        token: "{{ token }}"
        discovery_token_hash: "{{ discovery_token_hash }}"
      register: join_out
    - debug:
        msg: "Join output: {{ join_out.stdout }}"
# If a “cilium pod Init:CrashLoopBackOff” err occurs, try waiting for a while—this may resolve the issue. 
#    - name: Wait "{{ wait_etcd_timeout }}" s for etcd to stabilise
#      pause:
#        seconds: "{{ wait_etcd_timeout }}"

- name: install Cilium
  hosts: control_plan
  become: true
  vars:
#    ansible_become_pass: "{{ secret }}"
    cilium_cluster_cidr: "{{ cluster_cidr_args }}"
  roles:
    - install-cilium
# ── deploy_main_cluster_complet ────────────────────────────────────

