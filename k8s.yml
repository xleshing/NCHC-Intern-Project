# In the Ubuntu initialization command, NOPASSWD is already set, so all ansible_become_pass: "{{ secret }}" lines are commented out.
# If encounter a missing sudo password error, try uncommenting these lines to resolve the issue.
# ── create_main_cluster_start ──────────────────────────────────────
- name: Create all cluster VMs
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create control-plane VMs
      include_role:
        name: create_vm
      vars:
        target_group: "{{ cp_target_group_name }}"
        flavor: "{{ create_vm.cp_flavor }}"
        vm_name: "control"
      loop: "{{ range(control_count) | list }}"
      loop_control:
        index_var: idx
  
    - name: Create master VMs
      include_role:
        name: create_vm
      vars:
        target_group: "{{ master_target_group_name }}"
        flavor: "{{ create_vm.master_flavor }}"
        vm_name: "master"
      loop: "{{ range(master_count) | list }}"
      loop_control:
        index_var: idx

    - name: init worker_flavors
      set_fact:
        worker_flavors: []

    - name: flatten flavor_counts
      set_fact:
        worker_flavors: "{{ worker_flavors + ([ item.key ] * (item.value | int)) }}"
      loop: "{{ create_vm.flavor_counts | dict2items }}"
      when: item.value | int > 0
    - debug:
        msg: "{{ worker_flavors }}"

    - name: Create worker VMs
      include_role:
        name: create_vm
      vars:
        target_group: "{{ worker_target_group_name }}"
        flavor: "{{ item }}"
        vm_name: "{{ item | replace('.', '_') }}-worker"
      loop: "{{ worker_flavors }}"
      loop_control:
        index_var: idx

- name: Create master LoadBalancer
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lb_name: "{{ hostvars[ groups[cp_target_group_name][0] ].vars.vm_name.split('_')[0] }}"
    members_port: "{{ create_lb.masters_members_port }}"
    listeners_port: "{{ create_lb.masters_listeners_port }}"
    cp_pool_target_group_name: "{{ cp_target_group_name }}"
    master_pool_target_group_name: "{{ master_target_group_name }}"
    worker_pool_target_group_name: "{{ worker_target_group_name }}"
    target_group: "{{ endpoint_target_group_name }}"
    pool_member_target: 'control'
  roles:
    - create_lb

- name: Create worker LoadBalancer
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lb_name: "{{ hostvars[ groups[cp_target_group_name][0] ].vars.vm_name.split('_')[0] }}_worker"
    members_port: "{{ create_lb.workers_members_port }}"
    listeners_port: "{{ create_lb.workers_listeners_port }}"
    cp_pool_target_group_name: "{{ cp_target_group_name }}"
    master_pool_target_group_name: "{{ master_target_group_name }}"
    worker_pool_target_group_name: "{{ worker_target_group_name }}"
    target_group: "{{ endpoint_target_group_name }}"
    pool_member_target: 'worker'
  roles:
    - create_lb

- name: Update worker LoadBalancer
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lb_name: "{{ hostvars[ groups[cp_target_group_name][0] ].vars.vm_name.split('_')[0] }}_worker"
    members_port: "{{ create_lb.workers_members_port }}"
    listeners_port: "{{ create_lb.workers_listeners_port }}"
    hc_members_port: "{{ create_lb.workers_hc_members_port }}"
    hc_listeners_port: "{{ create_lb.workers_hc_listeners_port }}"
    cp_pool_target_group_name: "{{ cp_target_group_name }}"
    master_pool_target_group_name: "{{ master_target_group_name }}"
    worker_pool_target_group_name: "{{ worker_target_group_name }}"
    pool_member_target: ''
  roles:
    - update_lb
# ── create_main_cluster_complet ────────────────────────────────────

# ── create_ceph_cluster_start ──────────────────────────────────────
- name: Create all ceph_cluster VMs
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create ceph_control-plane VMs
      include_role:
        name: create_vm
      vars:
        target_group: "{{ ceph_cp_target_group_name }}"
        flavor: "{{ create_vm.ceph_cp_flavor }}"
        vm_name: "ceph_control"
      loop: "{{ range(ceph_control_count) | list }}"
      loop_control:
        index_var: idx

    - name: Create ceph_master VMs
      include_role:
        name: create_vm
      vars:
        target_group: "{{ ceph_master_target_group_name }}"
        flavor: "{{ create_vm.ceph_master_flavor }}"
        vm_name: "ceph_master"
      loop: "{{ range(ceph_master_count) | list }}"
      loop_control:
        index_var: idx

    - name: Create ceph_worker VMs
      include_role:
        name: create_vm
      vars:
        target_group: "{{ ceph_worker_target_group_name }}"
        flavor: "{{ create_vm.ceph_worker_flavor }}"
        vm_name: "ceph_worker"
      loop: "{{ range(ceph_worker_count) | list }}"
      loop_control:
        index_var: idx

    - name: Create ceph node Volumes
      include_role:
        name: create_vol
      vars:
        vol_name: "{{ hostvars[ groups[ceph_worker_target_group_name][idx] ].vars.vm_name.split('_')[0]  }}"
      loop: "{{ range(ceph_worker_count) | list }}"
      loop_control:
        index_var: idx

- name: Create ceph_LoadBalancer
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    listeners_port: "{{ create_lb.masters_listeners_port }}"
    members_port: "{{ create_lb.masters_members_port }}"
    lb_name: "{{ hostvars[ groups[ceph_cp_target_group_name][0] ].vars.vm_name.split('_')[0] }}"
    cp_pool_target_group_name: "{{ ceph_cp_target_group_name }}"
    master_pool_target_group_name: "{{ ceph_master_target_group_name }}"
    worker_pool_target_group_name: "{{ ceph_worker_target_group_name }}"
    target_group: "{{ ceph_endpoint_target_group_name }}"
    pool_member_target: 'control'
  roles:
    - create_lb
# ── create_ceph_cluster_complet ────────────────────────────────────

# ── install_all_deps_start ──────────────────────────────────────
