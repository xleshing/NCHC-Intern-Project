  hosts: control_plan,masters,workers,ceph_control_plan,ceph_masters,ceph_workers 
  become: true
#  vars:
#    ansible_become_pass: "{{ secret }}"
  roles:
    - install-ntp

- name: install k8s-deps (Docker, containerd, kubelet/kubeadm/kubectl)
  hosts: control_plan,masters,workers,ceph_control_plan,ceph_masters,ceph_workers
  become: true
#  vars:
