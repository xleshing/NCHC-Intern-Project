- name: Create all cluster VMs
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create control-plane VMs
      include_role:
        name: create_vm
      vars:
        target_group: control_plan
        vm_name: "control-{{ idx }}"
      loop: "{{ range(1, control_count + 1) | list }}"
      loop_control:
        index_var: idx
  
    - name: Create master VMs
      include_role:
        name: create_vm
      vars:
        target_group: masters
        vm_name: "master-{{ idx }}"
      loop: "{{ range(1, master_count + 1) | list }}"
      loop_control:
        index_var: idx

    - name: Create worker node VMs
      include_role:
        name: create_vm
      vars:
        target_group: workers
        vm_name: "worker-{{ idx }}"
      loop: "{{ range(1, worker_count + 1) | list }}"
      loop_control:
        index_var: idx

    - name: Create ceph sc node VMs
      vars:
        target_group: ceph_server
        vm_name: "ceph-server"
      roles:
        - creat_vm

- name: Create LoadBalancer 
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - create_lb

- name: install k8s-deps (Docker, containerd, kubelet/kubeadm/kubectl)
  hosts: control_plan,masters,workers
  become: true
  vars:
    ansible_become_password: "{{ secret }}"
  roles:
    - install-k8s-deps

- name: Deploy Kubernetes Master and generate tokens
  hosts: control_plan
  remote_user: "{{ ssh_user }}"
  become: true
  vars:
    ansible_become_password: "{{ secret }}"
  tasks:     
    - name: Init Kubernetes Master
      master_init:
        cluster_cidr: "{{ cluster_cidr_args }}"
        cluster_endpoint: "{{ hostvars[ groups['loadbalancer'][0] ].vars.ansible_host }}"
        kube_user: "{{ ansible_user }}"
      register: init_out
    - debug:
        msg:
          - "cluster_cidr: {{ cluster_cidr_args }}"
          - "join_endpoint: {{ init_out.join_endpoint }}"
          - "token: {{ init_out.token }}"
          - "discovery_token_hash: {{ init_out.discovery_token_hash }}"
          - "certificate_key: {{ init_out.certificate_key }}"

- name: Join Kubernetes Master
  hosts: masters
  become: true
  vars:
    ansible_become_password: "{{ secret }}"
    master_host: "{{ groups['control_plan'][0] }}"
    join_endpoint: "{{ hostvars[master_host].init_out.join_endpoint }}"
    token: "{{ hostvars[master_host].init_out.token }}"
    discovery_token_hash: "{{ hostvars[master_host].init_out.discovery_token_hash }}"
    certificate_key: "{{ hostvars[master_host].init_out.certificate_key }}"
  tasks:
    - name: Join Kubernetes Master
      master_join:
        join_endpoint: "{{ join_endpoint }}"
        token: "{{ token }}"
        discovery_token_hash: "{{ discovery_token_hash }}"
        certificate_key: "{{ certificate_key }}"
      register: master_join_out
    - debug:
        msg: "Join output: {{ master_join_out.stdout }}"

- name: Deploy Kubernetes Worker and using tokens
  hosts: workers 
  become: true
  vars:
    ansible_become_password: "{{ secret }}"
    master_host: "{{ groups['control_plan'][0] }}"
    join_endpoint: "{{ hostvars[master_host].init_out.join_endpoint }}"
    token: "{{ hostvars[master_host].init_out.token }}"
    discovery_token_hash: "{{ hostvars[master_host].init_out.discovery_token_hash }}"
  tasks:                                                          
    - name: Init Kubernetes Worker
      slave_init:
        join_endpoint: "{{ join_endpoint }}"
        token: "{{ token }}"
        discovery_token_hash: "{{ discovery_token_hash }}"
      register: join_out
    - debug:
        msg: "Join output: {{ join_out.stdout }}"

- name: install Cilium
  hosts: control_plan
  become: true
  vars:
    ansible_become_password: "{{ secret }}"
    cilium_cluster_cidr: "{{ cluster_cidr_args }}"
  roles:
    - install-cilium

- name: install Nvidia-GPU-Operator
  hosts: control_plan
  remote_user: "{{ ssh_user }}"
  become: true
  vars:
    ansible_become_password: "{{ secret }}"
    kube_user: "{{ ansible_user }}"
  roles:
    - install-Nvidia-GPU-Operator
